<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Sea Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- language selector (top-right) -->
  <select id="langSel" class="lang-sel" aria-label="Language / Мова">
    <option value="en">🇬🇧</option>
    <option value="uk">🇺🇦</option>
  </select>

  <!-- name prompt (first visit) -->
  <div id="nameModal" class="modal hidden">
    <div class="modal-box">
      <h2 id="modalTitle">Sea Battle</h2>
      <label id="nameLabel" for="nameInput">Your name</label>
      <input id="nameInput" type="text" maxlength="20" autocomplete="off" placeholder="Captain">
      <button id="joinBtn">Join</button>
    </div>
  </div>

  <!-- result overlay -->
  <div id="overlay" class="overlay hidden">
    <div class="overlay-box">
      <div id="overlayText"></div>
      <button id="rematchBtn">New Game</button>
      <p id="rematchStatus" class="rematch-status" aria-live="polite"></p>
    </div>
  </div>

  <header>
    <div class="banner">
      <button id="myName" class="myname">You</button>
      <span id="vsLabel" class="vs">vs</span>
      <span id="oppName"></span>
      <span id="oppDot" class="dot off"></span>
    </div>
  </header>

  <p id="status" class="status" aria-live="polite"></p>

  <main>
    <section id="enemySection" class="board-section hidden">
      <h3 id="enemyTitle">Enemy waters</h3>
      <div id="enemyGrid" class="grid"></div>
    </section>

    <section id="ownSection" class="board-section">
      <h3 id="ownTitle">Your fleet</h3>
      <div id="ownGrid" class="grid"></div>
    </section>

    <section id="placeSection" class="place-panel">
      <div id="palette" class="palette"></div>
      <button id="startBtn" disabled>Start</button>
      <p id="placeHint" class="hint">Tap a ship, then the grid to place. Drag to move, double-tap to rotate.</p>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="rules.js"></script>
  <script src="board.js"></script>
  <script src="place.js"></script>
  <script src="app.js"></script>
</body>
</html>
